<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      /* The game fills whatever frame it is embedded in. */
      #unity-canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; }
      #bar { position: absolute; left: 50%; top: 50%; width: 40%; height: 6px; transform: translate(-50%, -50%); background: #333; border-radius: 3px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #ff4d12; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="bar"><div id="fill"></div></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      // Keys go to the game whenever this page has focus, e.g. when an embedding
      // page focuses this iframe, so players don't need an extra click first.
      window.addEventListener("focus", function () { canvas.focus(); });
      document.addEventListener("pointerdown", function () { canvas.focus(); });

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#bar").remove();
          if (document.hasFocus()) canvas.focus();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
